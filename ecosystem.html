<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<title>Veslo – Ekosystém</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: transparent;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: 'Inter', sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  .scene {
    position: relative;
    width: 520px;
    height: 280px;
  }

  /* SVG lines layer */
  .lines {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
  }

  /* Pill shared */
  .pill {
    position: absolute;
    background: #1A1A1A;
    border-radius: 100px;
    padding: 13px 22px;
    display: flex;
    align-items: center;
    gap: 9px;
    white-space: nowrap;
    box-shadow: 0 6px 20px rgba(0,0,0,0.18);
  }

  .pill-icon {
    width: 22px;
    height: 22px;
    border-radius: 7px;
    background: #F97316;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  .pill-label {
    font-size: 14px;
    font-weight: 600;
    color: #ffffff;
    letter-spacing: 0.1px;
  }

  /* Individual pill positions & rotations */
  .pill-pokladna {
    left: 18px;
    bottom: 56px;
    transform: rotate(-8deg);
  }
  .pill-terminal {
    left: 160px;
    top: 28px;
    transform: rotate(5deg);
  }
  .pill-admin {
    right: 30px;
    top: 60px;
    transform: rotate(-4deg);
  }
  .pill-appka {
    right: 60px;
    bottom: 44px;
    transform: rotate(7deg);
  }

  /* Central hub */
  .hub {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    width: 48px;
    height: 48px;
    border-radius: 50%;
    background: #1A1A1A;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 2;
  }
  .hub-ring {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    width: 70px;
    height: 70px;
    border-radius: 50%;
    background: rgba(26,26,26,0.1);
    z-index: 1;
  }

  /* Export button */
  #export-btn {
    position: fixed;
    bottom: 24px;
    right: 24px;
    background: #1A1A1A;
    color: #fff;
    border: none;
    border-radius: 10px;
    padding: 12px 20px;
    font-size: 13px;
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
    z-index: 9999;
    box-shadow: 0 4px 14px rgba(0,0,0,0.2);
  }
</style>
</head>
<body>
<div class="scene" id="scene">

  <!-- Connection lines (SVG, drawn between pill centers) -->
  <svg class="lines" viewBox="0 0 520 280" xmlns="http://www.w3.org/2000/svg">
    <!-- Pokladňa center ~120,198 → hub ~260,140 -->
    <line x1="140" y1="196" x2="260" y2="140" stroke="#1A1A1A" stroke-width="1.5" stroke-dasharray="5 5" opacity="0.25"/>
    <!-- Terminál center ~235,55 → hub ~260,140 -->
    <line x1="235" y1="55" x2="260" y2="140" stroke="#1A1A1A" stroke-width="1.5" stroke-dasharray="5 5" opacity="0.25"/>
    <!-- Admin portál center ~375,82 → hub ~260,140 -->
    <line x1="375" y1="84" x2="260" y2="140" stroke="#1A1A1A" stroke-width="1.5" stroke-dasharray="5 5" opacity="0.25"/>
    <!-- Mobilná appka center ~375,210 → hub ~260,140 -->
    <line x1="375" y1="210" x2="260" y2="140" stroke="#1A1A1A" stroke-width="1.5" stroke-dasharray="5 5" opacity="0.25"/>
    <!-- Cross lines for extra mesh feel -->
    <line x1="140" y1="196" x2="235" y2="55" stroke="#1A1A1A" stroke-width="1" stroke-dasharray="4 7" opacity="0.12"/>
    <line x1="375" y1="84" x2="375" y2="210" stroke="#1A1A1A" stroke-width="1" stroke-dasharray="4 7" opacity="0.12"/>
  </svg>

  <!-- Hub -->
  <div class="hub-ring"></div>
  <div class="hub">
    <!-- V wordmark as simple text -->
    <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
      <path d="M4 4L10 16L16 4" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </div>

  <!-- Pill 1: Pokladňa -->
  <div class="pill pill-pokladna">
    <div class="pill-icon">
      <!-- Cash register icon -->
      <svg width="13" height="13" viewBox="0 0 14 14" fill="none">
        <rect x="1" y="5" width="12" height="8" rx="1.5" stroke="white" stroke-width="1.5"/>
        <path d="M4 5V3.5C4 2.67 4.67 2 5.5 2h3C9.33 2 10 2.67 10 3.5V5" stroke="white" stroke-width="1.5"/>
        <rect x="4" y="8" width="2" height="2" rx="0.5" fill="white"/>
        <rect x="7" y="8" width="2" height="2" rx="0.5" fill="white"/>
      </svg>
    </div>
    <span class="pill-label">Pokladňa</span>
  </div>

  <!-- Pill 2: Terminál -->
  <div class="pill pill-terminal">
    <div class="pill-icon">
      <!-- Card/terminal icon -->
      <svg width="13" height="13" viewBox="0 0 14 14" fill="none">
        <rect x="1" y="3" width="12" height="8" rx="1.5" stroke="white" stroke-width="1.5"/>
        <path d="M1 6h12" stroke="white" stroke-width="1.5"/>
        <rect x="3" y="8" width="3" height="1.5" rx="0.4" fill="white"/>
      </svg>
    </div>
    <span class="pill-label">Terminál</span>
  </div>

  <!-- Pill 3: Admin portál -->
  <div class="pill pill-admin">
    <div class="pill-icon">
      <!-- Grid/portal icon -->
      <svg width="13" height="13" viewBox="0 0 14 14" fill="none">
        <rect x="1" y="1" width="5" height="5" rx="1" fill="white"/>
        <rect x="8" y="1" width="5" height="5" rx="1" fill="white" opacity="0.7"/>
        <rect x="1" y="8" width="5" height="5" rx="1" fill="white" opacity="0.7"/>
        <rect x="8" y="8" width="5" height="5" rx="1" fill="white" opacity="0.5"/>
      </svg>
    </div>
    <span class="pill-label">Admin portál</span>
  </div>

  <!-- Pill 4: Mobilná appka -->
  <div class="pill pill-appka">
    <div class="pill-icon">
      <!-- Phone icon -->
      <svg width="13" height="13" viewBox="0 0 14 14" fill="none">
        <rect x="3" y="1" width="8" height="12" rx="2" stroke="white" stroke-width="1.5"/>
        <circle cx="7" cy="11" r="0.8" fill="white"/>
      </svg>
    </div>
    <span class="pill-label">Mobilná appka</span>
  </div>

</div>

<button id="export-btn">⬇ Export PNG</button>
<script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
<script>
  document.getElementById('export-btn').addEventListener('click', function() {
    const btn = document.getElementById('export-btn');
    btn.style.display = 'none';
    html2canvas(document.getElementById('scene'), {
      backgroundColor: null,
      scale: 3,
      useCORS: true,
      logging: false
    }).then(function(canvas) {
      const link = document.createElement('a');
      link.download = 'veslo-ecosystem.png';
      link.href = canvas.toDataURL('image/png');
      link.click();
      btn.style.display = '';
    });
  });
</script>
</body>
</html>
