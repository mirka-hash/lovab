<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Veslo – Hero Referral Image</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: transparent;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  .wrapper {
    position: relative;
    width: 460px;
    padding: 60px 60px;
    background: transparent;
    border-radius: 32px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  /* Corner decorations */
  .dot {
    position: absolute;
    width: 11px;
    height: 11px;
    border-radius: 50%;
    background: #F97316;
  }
  .dot.tl { top: 20px; left: 20px; }
  .dot.tr { top: 20px; right: 20px; }
  .dot.bl { bottom: 20px; left: 20px; }
  .dot.br { bottom: 20px; right: 20px; }

  .line-top {
    position: absolute;
    top: 24.5px; left: 42px; right: 42px;
    height: 1.5px; background: #CFC8BE; border-radius: 2px;
  }
  .line-bottom {
    position: absolute;
    bottom: 24.5px; left: 42px; right: 42px;
    height: 1.5px; background: #CFC8BE; border-radius: 2px;
  }
  .line-left {
    position: absolute;
    left: 24.5px; top: 42px; bottom: 42px;
    width: 1.5px; background: #CFC8BE; border-radius: 2px;
  }
  .line-right {
    position: absolute;
    right: 24.5px; top: 42px; bottom: 42px;
    width: 1.5px; background: #CFC8BE; border-radius: 2px;
  }

  /* ── Card shell (grey backing layer) ── */
  .card-shell {
    background: #E3DDD7;
    border: 1px solid #D2CBC3;
    border-radius: 22px;
    padding: 4px 4px 7px 4px;
    position: relative;
  }

  /* ── White card (floats above shell) ── */
  .card {
    background: #FFFFFF;
    border-radius: 18px;
    padding: 22px 26px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.09), 0 0px 1px rgba(0,0,0,0.05);
    position: relative;
  }

  /* ── Card 1 – Lead odoslaný ── */
  .card-1 {
    display: flex;
    align-items: center;
    gap: 16px;
  }

  .avatars {
    display: flex;
    align-items: center;
    flex-shrink: 0;
  }
  .avatar {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    border: 2.5px solid #fff;
    margin-right: -9px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 13px;
    font-weight: 700;
    color: #fff;
    letter-spacing: 0;
  }
  .avatar:last-child { margin-right: 0; }
  .av1 { background: #7EB8C9; }
  .av2 { background: #8BAFC8; }
  .av3 { background: #C8956A; }

  .card-1-text {
    flex: 1;
    min-width: 0;
  }
  .card-1-text .label {
    font-size: 11.5px;
    color: #B0A89E;
    font-weight: 500;
    letter-spacing: 0.2px;
    margin-bottom: 3px;
  }
  .card-1-text .title {
    font-size: 14px;
    font-weight: 600;
    color: #1A1A1A;
    line-height: 1.35;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .card-1-text .sub {
    font-size: 12px;
    color: #B0A89E;
    font-weight: 400;
    margin-top: 1px;
  }

  .card-1-right {
    text-align: right;
    flex-shrink: 0;
  }
  .card-1-right .count {
    font-size: 30px;
    font-weight: 800;
    color: #F97316;
    letter-spacing: -1px;
    line-height: 1;
  }
  .card-1-right .count-label {
    font-size: 11px;
    color: #B0A89E;
    font-weight: 500;
    margin-top: 2px;
  }

  /* Floating badge */
  .float-badge {
    position: absolute;
    top: -10px;
    right: -8px;
    background: #F97316;
    color: white;
    border-radius: 50%;
    width: 28px;
    height: 28px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    line-height: 1;
    box-shadow: 0 3px 10px rgba(249,115,22,0.45);
    z-index: 2;
  }

  /* ── Card 2 – Odmeny / chart ── */
  .card-2-top {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    margin-bottom: 18px;
  }
  .card-2-top .card-title {
    font-size: 15px;
    font-weight: 700;
    color: #1A1A1A;
    margin-bottom: 2px;
  }
  .card-2-top .card-period {
    font-size: 12px;
    color: #B0A89E;
    font-weight: 400;
  }

  .payout-pill {
    display: flex;
    align-items: center;
    gap: 6px;
    background: #FEF3E8;
    border-radius: 24px;
    padding: 5px 12px 5px 6px;
    font-size: 12px;
    color: #F97316;
    font-weight: 600;
    white-space: nowrap;
  }
  .payout-pill .pill-icon {
    width: 20px;
    height: 20px;
    background: #F97316;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;
    font-size: 10px;
    line-height: 1;
    flex-shrink: 0;
  }

  .card-2-body {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 12px;
  }

  .card-2-left { flex: 1; }
  .amount-row {
    display: flex;
    align-items: baseline;
    gap: 8px;
    margin-bottom: 6px;
  }
  .amount-row .amount {
    font-size: 36px;
    font-weight: 800;
    color: #1A1A1A;
    letter-spacing: -1.5px;
    line-height: 1;
  }
  .amount-row .growth {
    font-size: 13px;
    font-weight: 700;
    color: #F97316;
  }
  .card-2-desc {
    font-size: 12px;
    color: #B0A89E;
    line-height: 1.5;
    font-weight: 400;
  }

  .chart-area { flex-shrink: 0; }
  .bar-chart {
    display: flex;
    align-items: flex-end;
    gap: 7px;
    height: 64px;
  }
  .bar {
    width: 24px;
    border-radius: 6px 6px 0 0;
    background: #EDE8F7;
  }
  .bar.hi { background: #F97316; }
  .bar-labels {
    display: flex;
    gap: 7px;
    margin-top: 5px;
  }
  .bar-label {
    width: 24px;
    text-align: center;
    font-size: 10px;
    color: #C8C0B8;
    font-weight: 500;
  }

  /* ── Card 3 – Celkové odmeny ── */
  .card-3 {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
  }
  .card-3-label {
    font-size: 12.5px;
    color: #B0A89E;
    font-weight: 500;
    margin-bottom: 5px;
  }
  .card-3-total {
    font-size: 28px;
    font-weight: 800;
    color: #1A1A1A;
    letter-spacing: -1px;
    line-height: 1;
    margin-bottom: 8px;
  }
  .status-pill {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-size: 12px;
    font-weight: 600;
    color: #16A34A;
    background: #F0FDF4;
    padding: 4px 10px;
    border-radius: 20px;
  }
  .status-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #22C55E;
    flex-shrink: 0;
  }

  .card-3-right {
    text-align: right;
    flex-shrink: 0;
  }
  .next-payout-label {
    font-size: 11px;
    color: #B0A89E;
    font-weight: 500;
    margin-bottom: 4px;
  }
  .next-payout-date {
    font-size: 18px;
    font-weight: 800;
    color: #1A1A1A;
    letter-spacing: -0.5px;
  }
  .next-payout-amount {
    font-size: 13px;
    font-weight: 700;
    color: #F97316;
    margin-top: 2px;
  }

  #export-btn {
    position: fixed;
    bottom: 24px;
    right: 24px;
    background: #1A1A1A;
    color: #fff;
    border: none;
    border-radius: 10px;
    padding: 12px 20px;
    font-size: 13px;
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
    z-index: 9999;
    box-shadow: 0 4px 14px rgba(0,0,0,0.2);
  }
  #export-btn:hover { background: #333; }
</style>
</head>
<body>
<div class="wrapper">
  <!-- Corner dots & lines -->
  <div class="dot tl"></div>
  <div class="dot tr"></div>
  <div class="dot bl"></div>
  <div class="dot br"></div>
  <div class="line-top"></div>
  <div class="line-bottom"></div>
  <div class="line-left"></div>
  <div class="line-right"></div>

  <!-- Card 1: Lead sent -->
  <div class="card-shell">
    <div class="card card-1">
      <div class="float-badge">↗</div>
      <div class="avatars">
        <div class="avatar av1">MK</div>
        <div class="avatar av2">JN</div>
        <div class="avatar av3">PH</div>
      </div>
      <div class="card-1-text">
        <div class="label">Odoslaný lead</div>
        <div class="title">Reštaurácia Starý Dvor</div>
        <div class="sub">pokladňa + terminál</div>
      </div>
      <div class="card-1-right">
        <div class="count">47</div>
        <div class="count-label">leadov celkom</div>
      </div>
    </div>
  </div>

  <!-- Card 2: Monthly earnings + chart -->
  <div class="card-shell">
    <div class="card">
      <div class="card-2-top">
        <div>
          <div class="card-title">Moje odmeny</div>
          <div class="card-period">Apríl 2025</div>
        </div>
        <div class="payout-pill">
          <div class="pill-icon">↙</div>
          +2 nové dealy
        </div>
      </div>

      <div class="card-2-body">
        <div class="card-2-left">
          <div class="amount-row">
            <span class="amount">320 €</span>
            <span class="growth">↗ +80 €</span>
          </div>
          <div class="card-2-desc">Odmeny vzrástli<br>tento mesiac o 25 %</div>
        </div>
        <div class="chart-area">
          <div class="bar-chart">
            <div class="bar" style="height:36px"></div>
            <div class="bar" style="height:28px"></div>
            <div class="bar hi" style="height:60px"></div>
            <div class="bar" style="height:44px"></div>
          </div>
          <div class="bar-labels">
            <span class="bar-label">Jan</span>
            <span class="bar-label">Feb</span>
            <span class="bar-label">Mar</span>
            <span class="bar-label">Apr</span>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Card 3: Total earnings + next payout -->
  <div class="card-shell">
    <div class="card card-3">
      <div>
        <div class="card-3-label">Celkové odmeny</div>
        <div class="card-3-total">1 240 €</div>
        <div class="status-pill">
          <div class="status-dot"></div>
          Vyplatené
        </div>
      </div>
      <div class="card-3-right">
        <div class="next-payout-label">Ďalšia výplata</div>
        <div class="next-payout-date">25. máj</div>
        <div class="next-payout-amount">+ 320 €</div>
      </div>
    </div>
  </div>
</div>

<button id="export-btn">⬇ Export PNG</button>

<script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
<script>
  document.getElementById('export-btn').addEventListener('click', function() {
    const btn = document.getElementById('export-btn');
    btn.style.display = 'none';
    html2canvas(document.querySelector('.wrapper'), {
      backgroundColor: null,
      scale: 3,
      useCORS: true,
      logging: false
    }).then(function(canvas) {
      const link = document.createElement('a');
      link.download = 'veslo-hero-referral.png';
      link.href = canvas.toDataURL('image/png');
      link.click();
      btn.style.display = '';
    });
  });
</script>
</body>
</html>
