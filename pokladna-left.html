<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<title>Pokladňa – Ľavý obrázok</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: transparent;
    display: flex; align-items: center; justify-content: center;
    min-height: 100vh;
    font-family: 'Inter', -apple-system, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .card {
    background: #fff;
    border-radius: 22px;
    padding: 22px 22px 18px;
    width: 300px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.07), 0 8px 32px rgba(0,0,0,0.07);
  }
  .header {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 14px;
  }
  .header-label { font-size: 13px; font-weight: 500; color: #888; }
  .live-badge {
    display: flex; align-items: center; gap: 5px;
    background: #F0FDF4; border: 1px solid #BBF7D0;
    border-radius: 20px; padding: 3px 9px;
    font-size: 11px; font-weight: 700; color: #16A34A;
  }
  .live-dot { width: 6px; height: 6px; border-radius: 50%; background: #22C55E; }
  .revenue-row { display: flex; align-items: baseline; gap: 10px; margin-bottom: 3px; }
  .revenue-amount { font-size: 34px; font-weight: 800; color: #111; letter-spacing: -1.5px; line-height: 1; }
  .revenue-growth { font-size: 12px; font-weight: 700; color: #16A34A; background: #F0FDF4; padding: 3px 7px; border-radius: 20px; }
  .revenue-sub { font-size: 11.5px; color: #B0A89E; margin-bottom: 14px; }
  .stats-row { display: flex; gap: 8px; margin-bottom: 16px; }
  .stat-box { flex: 1; background: #F8F7F5; border-radius: 12px; padding: 10px 12px; display: flex; align-items: center; gap: 8px; }
  .stat-icon { width: 26px; height: 26px; border-radius: 7px; background: #EDEAE6; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .stat-label { font-size: 10px; color: #B0A89E; font-weight: 500; display: block; margin-bottom: 1px; }
  .stat-value { font-size: 14px; font-weight: 700; color: #111; }
  .chart-label { font-size: 11px; color: #B0A89E; font-weight: 500; margin-bottom: 6px; }
  .chart-wrap { position: relative; height: 80px; }
  .tooltip {
    position: absolute; top: 2px; left: 88px;
    background: #fff; border-radius: 10px; padding: 6px 10px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.12); white-space: nowrap;
  }
  .tooltip-time { font-size: 11px; font-weight: 700; color: #111; margin-bottom: 3px; }
  .tooltip-row { font-size: 10px; color: #555; display: flex; align-items: center; gap: 4px; }
  .t-dot { width: 6px; height: 6px; border-radius: 50%; display: inline-block; }
  #export-btn {
    position: fixed; bottom: 24px; right: 24px;
    background: #1A1A1A; color: #fff; border: none;
    border-radius: 10px; padding: 12px 20px;
    font-size: 13px; font-weight: 600; font-family: inherit; cursor: pointer; z-index: 9999;
  }
</style>
</head>
<body>
<div class="card" id="card">
  <div class="header">
    <span class="header-label">Aktuálna tržba</span>
    <div class="live-badge"><div class="live-dot"></div> LIVE</div>
  </div>
  <div class="revenue-row">
    <span class="revenue-amount">1 284,50 €</span>
    <span class="revenue-growth">↗ 12.5%</span>
  </div>
  <div class="revenue-sub">1 044,31 € bez DPH</div>
<div class="chart-label">Vývoj tržieb (po hodinách)</div>
  <div class="chart-wrap">
    <svg width="100%" height="72" viewBox="0 0 256 72" preserveAspectRatio="none" style="display:block">
      <defs>
        <linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#F97316" stop-opacity="0.18"/>
          <stop offset="100%" stop-color="#F97316" stop-opacity="0"/>
        </linearGradient>
      </defs>
      <path d="M0 54 C20 52 35 42 55 36 C75 30 85 46 105 30 C120 18 135 22 155 14 C170 8 180 18 200 22 C215 26 230 44 256 48 L256 72 L0 72 Z" fill="url(#g)"/>
      <path d="M0 54 C20 52 35 42 55 36 C75 30 85 46 105 30 C120 18 135 22 155 14 C170 8 180 18 200 22 C215 26 230 44 256 48" fill="none" stroke="#F97316" stroke-width="2" stroke-linecap="round"/>
      <circle cx="155" cy="14" r="3.5" fill="#F97316"/>
      <circle cx="155" cy="14" r="7" fill="none" stroke="#F97316" stroke-width="1.5" opacity="0.35"/>
    </svg>
    <div class="tooltip">
      <div class="tooltip-time">11:00</div>
      <div class="tooltip-row"><span class="t-dot" style="background:#F97316"></span> Tržba: <strong>€1 010</strong></div>
    </div>
  </div>
</div>
<button id="export-btn">⬇ Export PNG</button>
<script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
<script>
  document.getElementById('export-btn').addEventListener('click', function() {
    var btn = document.getElementById('export-btn');
    btn.style.display = 'none';
    html2canvas(document.getElementById('card'), {
      backgroundColor: null, scale: 3, useCORS: true, logging: false
    }).then(function(canvas) {
      var a = document.createElement('a');
      a.download = 'pokladna-left.png';
      a.href = canvas.toDataURL('image/png');
      a.click();
      btn.style.display = '';
    });
  });
</script>
</body>
</html>
