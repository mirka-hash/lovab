<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<title>Pokladňa – Pravý obrázok</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: transparent;
    display: flex; align-items: center; justify-content: center;
    min-height: 100vh;
    font-family: 'Inter', -apple-system, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .card {
    background: #fff;
    border-radius: 22px;
    padding: 20px;
    width: 290px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.07), 0 8px 32px rgba(0,0,0,0.07);
  }
  .card-header {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 12px;
  }
  .card-title { font-size: 15px; font-weight: 700; color: #111; }
  .legend { display: flex; gap: 10px; }
  .leg { display: flex; align-items: center; gap: 4px; font-size: 10px; color: #666; font-weight: 500; }
  .leg-dot { width: 7px; height: 7px; border-radius: 50%; }

  /* Tab switcher */
  .tabs {
    display: flex; background: #F0EDE9; border-radius: 10px; padding: 3px; margin-bottom: 14px;
  }
  .tab {
    flex: 1; text-align: center; padding: 5px 0;
    font-size: 11px; font-weight: 600; color: #999; border-radius: 8px;
  }
  .tab.active { background: #fff; color: #111; }

  /* Table grid */
  .table-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 7px; }
  .table-tile {
    border-radius: 11px;
    padding: 10px 10px 9px;
    position: relative;
    overflow: hidden;
  }
  .tile-free { background: #EDFAF3; }
  .tile-busy { background: #FFF4E6; }
  .tile-reserved { background: #E8F8FF; }

  .tile-bar {
    height: 3px; border-radius: 3px; margin-bottom: 7px;
  }
  .bar-green { background: #22C55E; }
  .bar-orange { background: #F97316; }
  .bar-blue { background: #06B6D4; }

  .tile-num { font-size: 17px; font-weight: 800; color: #111; line-height: 1; margin-bottom: 2px; }
  .tile-label { font-size: 9px; font-weight: 500; }
  .label-free { color: #16A34A; }
  .label-busy { color: #888; }
  .label-reserved { color: #0891B2; }
  .tile-meta {
    display: flex; justify-content: space-between; align-items: center;
    margin-top: 5px;
  }
  .tile-amount { font-size: 9px; color: #888; }
  .tile-time { font-size: 9px; font-weight: 700; }
  .time-normal { color: #888; }
  .time-warn { color: #F97316; }

  #export-btn {
    position: fixed; bottom: 24px; right: 24px;
    background: #1A1A1A; color: #fff; border: none;
    border-radius: 10px; padding: 12px 20px;
    font-size: 13px; font-weight: 600; font-family: inherit; cursor: pointer; z-index: 9999;
  }
</style>
</head>
<body>
<div class="card" id="card">

  <div class="card-header">
    <span class="card-title">Mapa stolov</span>
    <div class="legend">
      <div class="leg"><div class="leg-dot" style="background:#22C55E"></div>Voľný (3)</div>
      <div class="leg"><div class="leg-dot" style="background:#F97316"></div>Obsadený (5)</div>
    </div>
  </div>

  <div class="tabs">
    <div class="tab">Bar</div>
    <div class="tab">Reštaurácia</div>
    <div class="tab active">Balkón</div>
  </div>

  <div class="table-grid">
    <!-- Stôl 1 – free -->
    <div class="table-tile tile-free">
      <div class="tile-bar bar-green"></div>
      <div class="tile-num">1</div>
      <div class="tile-label label-free">Voľný</div>
    </div>
    <!-- Stôl 2 – busy -->
    <div class="table-tile tile-busy">
      <div class="tile-bar bar-orange"></div>
      <div class="tile-num">2</div>
      <div class="tile-label label-busy">2 účty</div>
      <div class="tile-meta">
        <span class="tile-amount">1 250 Kč</span>
        <span class="tile-time time-normal">25 min</span>
      </div>
    </div>
    <!-- Stôl 3 – busy -->
    <div class="table-tile tile-busy">
      <div class="tile-bar bar-orange"></div>
      <div class="tile-num">3</div>
      <div class="tile-label label-busy">1 účet</div>
      <div class="tile-meta">
        <span class="tile-amount">1 250 Kč</span>
        <span class="tile-time time-normal">15 min</span>
      </div>
    </div>
    <!-- Stôl 4 – busy + warn -->
    <div class="table-tile tile-busy">
      <div class="tile-bar bar-orange"></div>
      <div class="tile-num">4</div>
      <div class="tile-label label-busy">3 účty</div>
      <div class="tile-meta">
        <span class="tile-amount">1 250 Kč</span>
        <span class="tile-time time-warn">+2 h</span>
      </div>
    </div>
    <!-- Stôl 5 – free -->
    <div class="table-tile tile-free">
      <div class="tile-bar bar-green"></div>
      <div class="tile-num">5</div>
      <div class="tile-label label-free">Voľný</div>
    </div>
    <!-- Stôl 6 – busy + warn -->
    <div class="table-tile tile-busy">
      <div class="tile-bar bar-orange"></div>
      <div class="tile-num">6</div>
      <div class="tile-label label-busy">2 účty</div>
      <div class="tile-meta">
        <span class="tile-amount">1 250 Kč</span>
        <span class="tile-time time-warn">75 min</span>
      </div>
    </div>
    <!-- Stôl 7 – free -->
    <div class="table-tile tile-free">
      <div class="tile-bar bar-green"></div>
      <div class="tile-num">7</div>
      <div class="tile-label label-free">Voľný</div>
    </div>
    <!-- Stôl 8 – reserved -->
    <div class="table-tile tile-reserved">
      <div class="tile-bar bar-blue"></div>
      <div class="tile-num">8</div>
      <div class="tile-label label-reserved">Rezervovaný</div>
      <div class="tile-meta">
        <span class="tile-amount">Fero</span>
        <span class="tile-time time-normal">18:00</span>
      </div>
    </div>
    <!-- Stôl 9 – busy -->
    <div class="table-tile tile-busy">
      <div class="tile-bar bar-orange"></div>
      <div class="tile-num">9</div>
      <div class="tile-label label-busy">2 účty</div>
      <div class="tile-meta">
        <span class="tile-amount">1 250 Kč</span>
        <span class="tile-time time-normal">5 min</span>
      </div>
    </div>
  </div>

</div>

<button id="export-btn">⬇ Export PNG</button>
<script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
<script>
  document.getElementById('export-btn').addEventListener('click', function() {
    var btn = document.getElementById('export-btn');
    btn.style.display = 'none';
    html2canvas(document.getElementById('card'), {
      backgroundColor: null, scale: 3, useCORS: true, logging: false
    }).then(function(canvas) {
      var a = document.createElement('a');
      a.download = 'pokladna-right.png';
      a.href = canvas.toDataURL('image/png');
      a.click();
      btn.style.display = '';
    });
  });
</script>
</body>
</html>
