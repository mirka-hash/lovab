<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<title>Preview – Ecosystem Embed</title>
<style>
  body {
    background: #D4F03D; /* preview only – lime card color */
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    margin: 0;
  }
</style>
</head>
<body>

<!-- ============================================================
     WEBFLOW EMBED CODE — copy everything between these comments
     ============================================================ -->

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@600;700&display=swap" rel="stylesheet">

<style>
  .veco-scene {
    position: relative;
    width: 420px;
    height: 220px;
    font-family: 'Inter', -apple-system, sans-serif;
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
  }

  /* ── Floating keyframes – varied rotation + Y for organic feel ── */
  @keyframes veco-f1 {
    0%, 100% { transform: rotate(-9deg)  translateY(0px); }
    50%       { transform: rotate(-7deg)  translateY(-8px); }
  }
  @keyframes veco-f2 {
    0%, 100% { transform: rotate(4deg)  translateY(0px); }
    50%       { transform: rotate(6deg)  translateY(-7px); }
  }
  @keyframes veco-f3 {
    0%, 100% { transform: rotate(8deg)   translateY(0px); }
    50%       { transform: rotate(6deg)   translateY(-9px); }
  }
  @keyframes veco-f4 {
    0%, 100% { transform: rotate(-5deg)  translateY(0px); }
    50%       { transform: rotate(-7deg)  translateY(-6px); }
  }
  @keyframes veco-pulse {
    0%, 100% { transform: translate(-50%, -50%) scale(1); }
    50%       { transform: translate(-50%, -50%) scale(1.07); }
  }

  /* ── Pill ── */
  .veco-pill {
    position: absolute;
    background: #1A1A1A;
    border-radius: 100px;
    padding: 7px 13px;
    display: flex;
    align-items: center;
    gap: 6px;
    white-space: nowrap;
  }
  .veco-icon {
    width: 16px;
    height: 16px;
    border-radius: 4px;
    background: #F97316;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .veco-label {
    font-size: 11px;
    font-weight: 600;
    color: #fff;
    letter-spacing: 0.1px;
  }

  /* Organic — hub is off-center right; pills at varied heights, not just corners */
  .veco-p1 { top: 6px;    left: 8px;   animation: veco-f1 4.2s ease-in-out infinite; }        /* far top-left */
  .veco-p2 { top: 68px;   right: -4px; animation: veco-f2 3.9s ease-in-out infinite 0.8s; }   /* mid-right, clips edge */
  .veco-p3 { bottom: 12px; left: 14px; animation: veco-f3 4.5s ease-in-out infinite 1.4s; }   /* bottom-left */
  .veco-p4 { bottom: 52px; right: 22px; animation: veco-f4 4.0s ease-in-out infinite 0.4s; }  /* mid-bottom-right */

  /* ── Hub — offset right of center ── */
  .veco-hub-ring {
    position: absolute;
    left: 58%; top: 52%;
    transform: translate(-50%, -50%);
    width: 58px; height: 58px;
    border-radius: 50%;
    background: rgba(255,255,255,0.35);
  }
  .veco-hub {
    position: absolute;
    left: 58%; top: 52%;
    width: 40px; height: 40px;
    border-radius: 50%;
    background: #ffffff;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 2;
    animation: veco-pulse 3.5s ease-in-out infinite;
  }
  .veco-hub img {
    width: 24px;
    height: 24px;
    display: block;
    object-fit: contain;
  }

  /* ── Lines ── */
  .veco-lines {
    position: absolute;
    inset: 0;
    width: 100%; height: 100%;
    pointer-events: none;
  }
</style>

<div class="veco-scene">

  <!-- Lines: viewBox 420×220, hub at (244, 114)
       p1 top-left:   left:8  top:6    pill~108×30 → center (62, 21)
       p2 mid-right:  right:-4 top:68  pill~130×30 → center (357, 83)
       p3 bot-left:   left:14 bot:12   pill~108×30 → center (68, 193)
       p4 mid-bot-r:  right:22 bot:52  pill~140×30 → center (305, 183) -->
  <svg class="veco-lines" viewBox="0 0 420 220" xmlns="http://www.w3.org/2000/svg">
    <line x1="62"  y1="21"  x2="244" y2="114" stroke="#1A1A1A" stroke-width="0.6" stroke-dasharray="2.5 3.5" opacity="0.35"/>
    <line x1="357" y1="83"  x2="244" y2="114" stroke="#1A1A1A" stroke-width="0.6" stroke-dasharray="2.5 3.5" opacity="0.35"/>
    <line x1="68"  y1="193" x2="244" y2="114" stroke="#1A1A1A" stroke-width="0.6" stroke-dasharray="2.5 3.5" opacity="0.35"/>
    <line x1="305" y1="183" x2="244" y2="114" stroke="#1A1A1A" stroke-width="0.6" stroke-dasharray="2.5 3.5" opacity="0.35"/>
  </svg>

  <!-- Hub: white circle + Veslo logo -->
  <div class="veco-hub-ring"></div>
  <div class="veco-hub">
    <img src="https://cdn.prod.website-files.com/69316ed57fdda6d978f4a479/69a365e040d2f63032000a00_veslo%20icon.svg" alt="Veslo" width="24" height="24">
  </div>

  <!-- Pill 1 – top-left: Terminál -->
  <div class="veco-pill veco-p1">
    <div class="veco-icon">
      <svg width="10" height="10" viewBox="0 0 14 14" fill="none">
        <rect x="1" y="3" width="12" height="8" rx="1.5" stroke="white" stroke-width="1.6"/>
        <path d="M1 6h12" stroke="white" stroke-width="1.6"/>
        <rect x="3" y="8" width="3" height="1.5" rx="0.4" fill="white"/>
      </svg>
    </div>
    <span class="veco-label">Terminál</span>
  </div>

  <!-- Pill 2 – top-right: Admin portál -->
  <div class="veco-pill veco-p2">
    <div class="veco-icon">
      <svg width="10" height="10" viewBox="0 0 14 14" fill="none">
        <rect x="1" y="1" width="5" height="5" rx="1" fill="white"/>
        <rect x="8" y="1" width="5" height="5" rx="1" fill="white" opacity="0.65"/>
        <rect x="1" y="8" width="5" height="5" rx="1" fill="white" opacity="0.65"/>
        <rect x="8" y="8" width="5" height="5" rx="1" fill="white" opacity="0.4"/>
      </svg>
    </div>
    <span class="veco-label">Admin portál</span>
  </div>

  <!-- Pill 3 – bottom-left: Pokladňa -->
  <div class="veco-pill veco-p3">
    <div class="veco-icon">
      <svg width="10" height="10" viewBox="0 0 14 14" fill="none">
        <rect x="1" y="5" width="12" height="8" rx="1.5" stroke="white" stroke-width="1.6"/>
        <path d="M4 5V3.5C4 2.67 4.67 2 5.5 2h3C9.33 2 10 2.67 10 3.5V5" stroke="white" stroke-width="1.6"/>
        <rect x="4" y="8" width="2" height="2" rx="0.5" fill="white"/>
        <rect x="7" y="8" width="2" height="2" rx="0.5" fill="white"/>
      </svg>
    </div>
    <span class="veco-label">Pokladňa</span>
  </div>

  <!-- Pill 4 – bottom-right: Mobilná appka -->
  <div class="veco-pill veco-p4">
    <div class="veco-icon">
      <svg width="10" height="10" viewBox="0 0 14 14" fill="none">
        <rect x="3" y="1" width="8" height="12" rx="2" stroke="white" stroke-width="1.6"/>
        <circle cx="7" cy="11" r="0.8" fill="white"/>
      </svg>
    </div>
    <span class="veco-label">Mobilná appka</span>
  </div>

</div>

<!-- ============================================================
     END OF WEBFLOW EMBED CODE
     ============================================================ -->

</body>
</html>
