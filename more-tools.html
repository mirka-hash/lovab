<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<title>Veslo – Viac leadov, viac nástrojov</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: transparent;
    display: flex;
    align-items: flex-end;
    justify-content: center;
    min-height: 100vh;
    font-family: 'Inter', sans-serif;
    -webkit-font-smoothing: antialiased;
    padding-bottom: 0;
  }

  .scene {
    position: relative;
    width: 520px;
    height: 300px;
    display: flex;
    align-items: flex-end;
    justify-content: center;
  }

  /* ── Stacked capability cards ── */
  .card-stack {
    position: relative;
    width: 320px;
    height: 260px;
    margin-bottom: 0;
  }

  .cap-card {
    position: absolute;
    width: 300px;
    border-radius: 18px;
    padding: 20px 22px;
    overflow: hidden;
  }

  /* Card 3 (back) – Advanced / locked */
  .card-back {
    background: linear-gradient(135deg, #2D2D2D 0%, #1A1A1A 100%);
    bottom: 0;
    left: 50%;
    transform: translateX(-50%) rotate(8deg) translateY(12px);
    width: 290px;
    opacity: 0.7;
    z-index: 1;
  }

  /* Card 2 (middle) – CRM Portal */
  .card-mid {
    background: linear-gradient(135deg, #374151 0%, #1F2937 100%);
    bottom: 12px;
    left: 50%;
    transform: translateX(-50%) rotate(-5deg) translateY(4px);
    z-index: 2;
  }

  /* Card 1 (front) – Lead Form / active */
  .card-front {
    background: linear-gradient(135deg, #F97316 0%, #EA580C 100%);
    bottom: 44px;
    left: 50%;
    transform: translateX(-50%) rotate(2deg);
    z-index: 3;
    box-shadow: 0 16px 40px rgba(249,115,22,0.35);
  }

  .card-label {
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.8px;
    text-transform: uppercase;
    opacity: 0.7;
    margin-bottom: 8px;
  }
  .card-name {
    font-size: 17px;
    font-weight: 800;
    color: #ffffff;
    letter-spacing: -0.3px;
    margin-bottom: 12px;
  }
  .card-front .card-label { color: rgba(255,255,255,0.8); }
  .card-mid .card-label { color: rgba(255,255,255,0.6); }
  .card-back .card-label { color: rgba(255,255,255,0.5); }

  .card-status {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    border-radius: 20px;
    padding: 4px 10px;
    font-size: 11px;
    font-weight: 600;
  }
  .status-active {
    background: rgba(255,255,255,0.25);
    color: #ffffff;
  }
  .status-dot {
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: #fff;
  }
  .status-locked {
    background: rgba(255,255,255,0.1);
    color: rgba(255,255,255,0.5);
  }
  .lock-icon {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    border: 1.5px solid rgba(255,255,255,0.4);
    flex-shrink: 0;
    position: relative;
  }

  /* Card decorative dots */
  .card-dots {
    position: absolute;
    right: 18px;
    top: 18px;
    display: flex;
    flex-direction: column;
    gap: 4px;
    opacity: 0.2;
  }
  .dot-row { display: flex; gap: 4px; }
  .dot-sm {
    width: 4px;
    height: 4px;
    border-radius: 50%;
    background: white;
  }

  /* Unlock badge */
  .unlock-badge {
    position: absolute;
    top: 8px;
    right: -8px;
    background: #1A1A1A;
    border-radius: 14px;
    padding: 6px 12px 6px 8px;
    display: flex;
    align-items: center;
    gap: 6px;
    z-index: 10;
    box-shadow: 0 4px 14px rgba(0,0,0,0.25);
  }
  .unlock-key {
    width: 22px;
    height: 22px;
    border-radius: 8px;
    background: #F97316;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .unlock-text {
    font-size: 11px;
    font-weight: 700;
    color: #ffffff;
    white-space: nowrap;
    line-height: 1.3;
  }
  .unlock-text span {
    display: block;
    font-size: 9px;
    font-weight: 500;
    color: rgba(255,255,255,0.6);
    letter-spacing: 0.3px;
    text-transform: uppercase;
  }

  /* Progress indicator at bottom */
  .progress-bar-wrap {
    position: absolute;
    bottom: -8px;
    left: 50%;
    transform: translateX(-50%);
    width: 240px;
    z-index: 10;
  }
  .progress-track {
    height: 5px;
    background: rgba(0,0,0,0.12);
    border-radius: 10px;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    width: 94%;
    background: #F97316;
    border-radius: 10px;
  }
  .progress-labels {
    display: flex;
    justify-content: space-between;
    margin-top: 5px;
  }
  .prog-label {
    font-size: 10px;
    color: rgba(0,0,0,0.35);
    font-weight: 500;
  }

  #export-btn {
    position: fixed;
    bottom: 24px;
    right: 24px;
    background: #1A1A1A;
    color: #fff;
    border: none;
    border-radius: 10px;
    padding: 12px 20px;
    font-size: 13px;
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
    z-index: 9999;
  }
</style>
</head>
<body>
<div class="scene" id="scene">

  <div class="card-stack">

    <!-- Unlock badge (top right of stack) -->
    <div class="unlock-badge">
      <div class="unlock-key">
        <svg width="12" height="12" viewBox="0 0 14 14" fill="none">
          <circle cx="6" cy="5" r="3" stroke="white" stroke-width="1.6"/>
          <path d="M6 8v4M4.5 10h3" stroke="white" stroke-width="1.6" stroke-linecap="round"/>
        </svg>
      </div>
      <div class="unlock-text">
        50 leadov
        <span>odomkne CRM portál</span>
      </div>
    </div>

    <!-- Card 3: back – Advanced (locked) -->
    <div class="cap-card card-back">
      <div class="card-dots">
        <div class="dot-row"><div class="dot-sm"></div><div class="dot-sm"></div><div class="dot-sm"></div></div>
        <div class="dot-row"><div class="dot-sm"></div><div class="dot-sm"></div><div class="dot-sm"></div></div>
      </div>
      <div class="card-label" style="color:rgba(255,255,255,0.4)">Level 3</div>
      <div class="card-name" style="opacity:0.5">ISO Partner</div>
      <div class="card-status status-locked">
        <div class="lock-icon"></div>
        Uzamknuté
      </div>
    </div>

    <!-- Card 2: middle – CRM Portal (locked) -->
    <div class="cap-card card-mid">
      <div class="card-dots">
        <div class="dot-row"><div class="dot-sm"></div><div class="dot-sm"></div><div class="dot-sm"></div></div>
        <div class="dot-row"><div class="dot-sm"></div><div class="dot-sm"></div><div class="dot-sm"></div></div>
      </div>
      <div class="card-label" style="color:rgba(255,255,255,0.55)">Level 2 · po 50 leadoch</div>
      <div class="card-name">CRM portál</div>
      <div class="card-status status-locked">
        <div class="lock-icon"></div>
        3 leady do odomknutia
      </div>
    </div>

    <!-- Card 1: front – Lead Form (active) -->
    <div class="cap-card card-front">
      <div class="card-dots">
        <div class="dot-row"><div class="dot-sm"></div><div class="dot-sm"></div><div class="dot-sm"></div></div>
        <div class="dot-row"><div class="dot-sm"></div><div class="dot-sm"></div><div class="dot-sm"></div></div>
      </div>
      <div class="card-label">Level 1 · aktívne</div>
      <div class="card-name">Referral partner</div>
      <div class="card-status status-active">
        <div class="status-dot"></div>
        Aktívny
      </div>
    </div>

    <!-- Progress bar at bottom -->
    <div class="progress-bar-wrap">
      <div class="progress-track">
        <div class="progress-fill"></div>
      </div>
      <div class="progress-labels">
        <span class="prog-label">47 leadov</span>
        <span class="prog-label" style="color:#F97316;font-weight:700">3 do CRM →</span>
      </div>
    </div>

  </div>
</div>

<button id="export-btn">⬇ Export PNG</button>
<script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
<script>
  document.getElementById('export-btn').addEventListener('click', function() {
    const btn = document.getElementById('export-btn');
    btn.style.display = 'none';
    html2canvas(document.getElementById('scene'), {
      backgroundColor: null,
      scale: 3,
      useCORS: true,
      logging: false
    }).then(function(canvas) {
      const link = document.createElement('a');
      link.download = 'veslo-more-tools.png';
      link.href = canvas.toDataURL('image/png');
      link.click();
      btn.style.display = '';
    });
  });
</script>
</body>
</html>
