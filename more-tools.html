<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<title>Veslo – Viac leadov, viac nástrojov</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: transparent;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: 'Inter', sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  .scene {
    position: relative;
    width: 480px;
    height: 280px;
  }

  /* ── Back card: CRM portal (dark, locked) ── */
  .card-back {
    position: absolute;
    width: 340px;
    height: 160px;
    border-radius: 22px;
    background: #1F2937;
    bottom: 20px;
    left: 50%;
    transform: translateX(-52%) rotate(-6deg);
    display: flex;
    align-items: flex-end;
    padding: 24px 28px;
  }

  .card-back-content {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  /* Lock ring — DOM element, no box-shadow */
  .lock-wrap {
    position: relative;
    width: 36px;
    height: 36px;
    flex-shrink: 0;
  }
  .lock-ring {
    position: absolute;
    inset: -6px;
    border-radius: 50%;
    background: rgba(249,115,22,0.15);
  }
  .lock-circle {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    background: rgba(249,115,22,0.2);
    border: 1.5px solid rgba(249,115,22,0.4);
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    z-index: 1;
  }

  .card-back-label {
    font-size: 11px;
    font-weight: 500;
    color: rgba(255,255,255,0.45);
    letter-spacing: 0.3px;
    margin-bottom: 3px;
  }
  .card-back-title {
    font-size: 18px;
    font-weight: 800;
    color: #ffffff;
    letter-spacing: -0.3px;
  }

  /* ── Front card: Referral (orange, active) ── */
  .card-front {
    position: absolute;
    width: 340px;
    height: 160px;
    border-radius: 22px;
    background: #F97316;
    bottom: 60px;
    left: 50%;
    transform: translateX(-48%) rotate(5deg);
    padding: 24px 28px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }

  /* Subtle pattern on front card */
  .card-pattern {
    position: absolute;
    top: 0; right: 0; bottom: 0; left: 0;
    border-radius: 22px;
    overflow: hidden;
  }
  .pattern-circle-1 {
    position: absolute;
    width: 180px;
    height: 180px;
    border-radius: 50%;
    border: 1px solid rgba(255,255,255,0.12);
    top: -60px;
    right: -40px;
  }
  .pattern-circle-2 {
    position: absolute;
    width: 120px;
    height: 120px;
    border-radius: 50%;
    border: 1px solid rgba(255,255,255,0.10);
    top: -20px;
    right: 20px;
  }

  .card-front-top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    position: relative;
    z-index: 1;
  }
  .card-front-label {
    font-size: 11px;
    font-weight: 600;
    color: rgba(255,255,255,0.7);
    letter-spacing: 0.5px;
    text-transform: uppercase;
  }

  /* Lead counter */
  .lead-counter {
    background: rgba(0,0,0,0.2);
    border-radius: 20px;
    padding: 4px 10px;
    font-size: 12px;
    font-weight: 700;
    color: #ffffff;
  }

  .card-front-bottom {
    position: relative;
    z-index: 1;
  }
  .card-front-title {
    font-size: 22px;
    font-weight: 800;
    color: #ffffff;
    letter-spacing: -0.5px;
    line-height: 1.1;
  }

  /* Progress track on front card */
  .card-progress {
    margin-top: 10px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .prog-track {
    flex: 1;
    height: 4px;
    background: rgba(255,255,255,0.25);
    border-radius: 4px;
    overflow: hidden;
  }
  .prog-fill {
    height: 100%;
    width: 94%;
    background: #ffffff;
    border-radius: 4px;
  }
  .prog-text {
    font-size: 11px;
    font-weight: 600;
    color: rgba(255,255,255,0.8);
    white-space: nowrap;
  }

  #export-btn {
    position: fixed;
    bottom: 24px;
    right: 24px;
    background: #1A1A1A;
    color: #fff;
    border: none;
    border-radius: 10px;
    padding: 12px 20px;
    font-size: 13px;
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
    z-index: 9999;
  }
</style>
</head>
<body>
<div class="scene" id="scene">

  <!-- Back card: CRM Portal (locked) -->
  <div class="card-back">
    <div class="card-back-content">
      <div class="lock-wrap">
        <div class="lock-ring"></div>
        <div class="lock-circle">
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
            <rect x="2.5" y="6" width="9" height="7" rx="1.5" stroke="#F97316" stroke-width="1.5"/>
            <path d="M4.5 6V4.5a2.5 2.5 0 0 1 5 0V6" stroke="#F97316" stroke-width="1.5" stroke-linecap="round"/>
          </svg>
        </div>
      </div>
      <div>
        <div class="card-back-label">Po 50 leadoch</div>
        <div class="card-back-title">CRM portál</div>
      </div>
    </div>
  </div>

  <!-- Front card: Referral partner (active) -->
  <div class="card-front">
    <div class="card-pattern">
      <div class="pattern-circle-1"></div>
      <div class="pattern-circle-2"></div>
    </div>
    <div class="card-front-top">
      <div class="card-front-label">Referral partner</div>
      <div class="lead-counter">47 leadov</div>
    </div>
    <div class="card-front-bottom">
      <div class="card-front-title">3 leady do<br>CRM portálu</div>
      <div class="card-progress">
        <div class="prog-track"><div class="prog-fill"></div></div>
        <div class="prog-text">47 / 50</div>
      </div>
    </div>
  </div>

</div>

<button id="export-btn">⬇ Export PNG</button>
<script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
<script>
  document.getElementById('export-btn').addEventListener('click', function() {
    const btn = document.getElementById('export-btn');
    btn.style.display = 'none';
    html2canvas(document.getElementById('scene'), {
      backgroundColor: null,
      scale: 3,
      useCORS: true,
      logging: false
    }).then(function(canvas) {
      const link = document.createElement('a');
      link.download = 'veslo-more-tools.png';
      link.href = canvas.toDataURL('image/png');
      link.click();
      btn.style.display = '';
    });
  });
</script>
</body>
</html>
